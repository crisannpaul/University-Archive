version: '3'

services:
  users-db:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'users_db'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - "3307:3306"
    volumes:
      - my-db:/var/lib/mysql
    networks:
      demo_net:
        ipv4_address: 172.30.0.3
  user-microservice:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - "8079:8080"
    environment:
      - DB_IP=users-db
      - DB_PORT=3306
      - DB_DBNAME=users_db
      - DB_USER=root
      - DB_PASSWORD=root
    networks:
      demo_net:
        ipv4_address: 172.30.0.2

volumes:
  my-db:

networks:
  demo_net:
    external: true

version: '3'

services:
  chat-db:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'chat_db'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - "3310:3306"
    volumes:
      - my-db:/var/lib/mysql
    networks:
      demo_net:
        ipv4_address: 172.30.3.3

  chat-backend:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - "8076:8083"
    environment:
      - DB_IP=chat-db
      - DB_PORT=3306
      - DB_DBNAME=chat_db
      - DB_USER=root
      - DB_PASSWORD=root
    networks:
      demo_net:
        ipv4_address: 172.30.3.2

volumes:
  my-db:

networks:
  demo_net:
    external: true
